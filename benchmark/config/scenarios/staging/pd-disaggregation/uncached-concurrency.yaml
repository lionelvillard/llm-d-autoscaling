# P/D DISAGGREGATION — KEDA experiment: uncached-concurrency (BACKEND-AGNOSTIC)
# The per-role ScaledObjects recommended by llm-d-autoscaling-research task 0545
# (findings/derived/system/pd/pd-scaledobjects-glm53.md, vLLM >= 0.32, llm-d-router >= v1.0.0):
#   - prefill: offered uncached prefill work, i.e. the prompt tokens the EPP sends to
#     prefill pods x the uncached share the prefill pods measure (vLLM local_compute /
#     prompt_tokens), floored at the computed tokens, / 0.7 x one pod's knee; scale up
#     after 15 min of sustained demand, scale down after 60 min;
#   - decode: max(decode concurrency / 4, offered decode demand, KV guard, ITL guard),
#     KEDA scalingModifiers; default fast scale-up, 1 pod / 2 min down after 5 min.
# Delta from baseline.yaml (this dir):
#   - `keda:` replaced by the two ScaledObjects above. Their metrics and formulas are
#     task 0545's; only the label selectors are adapted to this scenario (`role`, stamped
#     by the PodMonitors below, instead of `llm_d_ai_role`; `namespace` from the harness;
#     this stack's pods by `pod=~"${model.idLabel}-<role>-.*"` and its EPP by
#     `job="${model.idLabel}-router-epp"` and the producer's `plugin_name`, so a second
#     stack in the namespace is not summed in; ScaledObjects named per stack, trap T17).
#     See benchmark/protocol/verdicts/pd-disaggregation/uncached-concurrency.md.
#   - model: deepseek-ai/DeepSeek-V2-Lite instead of Qwen3-32B. Task 0545's reference
#     model is GLM-5.3 (MoE, MLA latent KV); DeepSeek-V2-Lite is a 16B MoE with MLA that
#     fits one H100 per pod and is in blis-signal-lab's catalog (deepseek-v2-lite);
#     maxModelLen 32768 and a 40Gi model PVC go with it.
#   - min/max replicas sized to a 1-GPU-per-pod plant (task 0545 sized them for TP8 H200).
# The per-pod constants in the formulas (marked CALIBRATE) are calibrated for this model:
# DeepSeek-V2-Lite, one H100 per pod, from the blis-signal-lab knees of the step 3
# evaluation (benchmark/protocol/verdicts/pd-disaggregation/uncached-concurrency-step3.md),
# with task 0545's rules. Task 0545's GLM-5.3 TP8 H200 values are given next to each one.
#
# This scenario deliberately contains NO backend-specific settings (image,
# accelerator, per-role resources, vLLM command, plugins). Pick a backend by
# layering one of benchmark/config/cluster-configs/{vllm,vllm-sim-qwen3-32b,inference-sim}.yaml
# via `--cluster-config`. See benchmark/README.md.
#
# Merge note: the harness deep-merges dicts but REPLACES lists wholesale. The
# scaling strategy (keda) lives here because its scaleTargetRef.kind is a
# topology concern (Deployment); backend overlays must not set `keda`.

scenario:
  - name: "pd-disaggregation"

    # =========================================================================
    # KUSTOMIZE DEPLOY METHOD — disabled; deploying via modelservice below
    # =========================================================================
    kustomize:
      enabled: false
      guideName: "pd-disaggregation"
      repoPath: ""
      repoRef: "main"
      gaieVersion: ""
      acceleratorBackend: "gpu/vllm"
      monitoring: false
      overlayPath: ""
      extraHelmValues: []
      extraHelmSets: {}
      guideVariableOverrides: {}
      patches: []

    # =========================================================================
    # MODEL — identity only. Backend overlays set gpuMemoryUtilization.
    # =========================================================================
    model:
      name: deepseek-ai/DeepSeek-V2-Lite   # served model id + harness request/tokenizer; must equal huggingfaceId
      shortName: deepseek-v2-lite
      path: models/deepseek-ai/DeepSeek-V2-Lite
      huggingfaceId: deepseek-ai/DeepSeek-V2-Lite
      maxModelLen: 32768         # the run set's agentic load needs > 8k contexts
      size: 40Gi                 # bf16 weights, about 31 GB

    # =========================================================================
    # DEPLOYMENT METHOD
    # =========================================================================
    modelservice:
      enabled: true

      uriProtocol: hf # no model-weight download; backends serve without weights

      # Gateway topology — epponly (no Kubernetes Gateway/HTTPRoute)
      gateway:
        className: epponly

      # Routing connector — nixlv2 selects the routing-sidecar wire protocol
      routing:
        connector: nixlv2

      # EPP router — PD plugin chain. EPP-side and independent of the backend.
      router:
        epp:
          replicas: 1
          pluginsConfigFile: "pd-config.yaml"
          pluginsCustomConfig:
            pd-config.yaml: |
              apiVersion: llm-d.ai/v1
              kind: EndpointPickerConfig
              plugins:
              - type: always-disagg-pd-decider
              - type: disagg-profile-handler
                parameters:
                  deciders:
                    prefill: always-disagg-pd-decider
              - type: approx-prefix-cache-producer
              - type: prefill-filter
              - type: decode-filter
              - type: prefix-cache-scorer
              - type: queue-scorer
              - type: kv-cache-utilization-scorer
              - type: active-request-scorer
              schedulingProfiles:
              - name: prefill
                plugins:
                - pluginRef: prefill-filter
                - pluginRef: prefix-cache-scorer
                  weight: 3
                - pluginRef: queue-scorer
                  weight: 2
                - pluginRef: kv-cache-utilization-scorer
                  weight: 2
              - name: decode
                plugins:
                - pluginRef: decode-filter
                - pluginRef: active-request-scorer
                  weight: 2
                - pluginRef: prefix-cache-scorer
                  weight: 3
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
        proxy:
          resources:
            requests:
              cpu: "50m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
        monitoring:
          prometheus:
            enabled: true

      httpRoute:
        requestTimeout: "300s"
        backendRequestTimeout: "0s"

    # =========================================================================
    # DECODE — backend-agnostic skeleton. Backend overlays add resources,
    # accelerator, vllm command, initContainers, env and volumes.
    # =========================================================================
    decode:
      replicas: 1
      accelerator:
        count: 1                 # per-role accelerator count; backend overlays override (0 for CPU sims)
      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1
      extraContainerConfig:
        ports:
          - containerPort: 8200 # metrics; matches modelservice decode metricsPort
            name: metrics
            protocol: TCP
      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s
          relabelings:
          - targetLabel: role
            replacement: decode
            action: replace

    # =========================================================================
    # PREFILL — backend-agnostic skeleton (see DECODE).
    # =========================================================================
    prefill:
      enabled: true
      replicas: 1
      accelerator:
        count: 1                 # per-role accelerator count; backend overlays override (0 for CPU sims)
      parallelism:
        tensor: 1
        data: 1
        dataLocal: 1
        workers: 1
      extraContainerConfig:
        ports:
          - containerPort: 8000 # metrics; matches modelservice prefill metricsPort
            name: metrics
            protocol: TCP
      monitoring:
        podmonitor:
          enabled: true
          portName: metrics
          path: /metrics
          interval: 15s
          relabelings:
          - targetLabel: role
            replacement: prefill
            action: replace

    standalone:
      enabled: false

    # =========================================================================
    # SCALING STRATEGY (KEDA) — task 0545's per-role ScaledObjects. Each one is
    # a KEDA scalingModifiers formula over raw-series triggers (threshold 1,
    # composite target 1, AverageValue: desired = ceil(formula)).
    # =========================================================================
    keda:
      enabled: true
      namespace: ""              # defaults to deploy namespace (first slot of `-p`)
      prometheus:
        baseUrl: http://prometheus-operated.monitoring.svc.cluster.local
        port: 9090
      scaledObjects:
      # -----------------------------------------------------------------------
      # PREFILL. Driver: offered uncached prefill work, the prompt tokens the EPP
      # sends to prefill pods (counted before send, so it keeps rising when prefill
      # saturates) x the uncached share the prefill pods measure on the prefills
      # they finish (local_compute / prompt_tokens: two counters taken at the same
      # moment, so saturation does not bias the ratio), / (0.7 x one pod's knee).
      # Guards: the computed tokens as a floor inside the formula; minReplicas 2;
      # scale-up after 15 min, scale-down after 60 min (each prefill scale event
      # costs session-prefix recomputes); fallback holds the current size.
      # Prerequisite: the EPP runs a prefix producer (approx-prefix-cache-producer
      # above); llm_d_epp_prefix_prompt_tokens exists from llm-d-router v1.0.0.
      # -----------------------------------------------------------------------
      - name: ${model.idLabel}-prefill
        scaleTargetRef:
          kind: Deployment
          name: ${model.idLabel}-prefill
        minReplicas: 2           # never 0 under P/D; CALIBRATE to warm load + cold-session headroom
        maxReplicas: 4
        pollingInterval: 15
        fallback:
          failureThreshold: 3
          replicas: 2
          behavior: currentReplicasIfHigher   # a Prometheus outage holds the current size
        behavior:
          scaleUp:
            # Longer than the time the floor needs to absorb a session-cache fill. CALIBRATE
            # (working set x copies / (floor x knee rate)); task 0545 §2.1.
            stabilizationWindowSeconds: 900
            selectPolicy: Max
            policies:
              - type: Pods
                value: 1
                periodSeconds: 300
          scaleDown:
            stabilizationWindowSeconds: 3600
            selectPolicy: Max
            policies:
              - type: Pods
                value: 1
                periodSeconds: 600
        scalingModifiers:
          target: "1"
          metricType: AverageValue
          # CALIBRATE: 37540 = 0.7 x 53,628 computed prompt tokens/s, one DeepSeek-V2-Lite H100
          # prefill pod's knee on the run set's blend (blis; GLM-5.3 TP8 H200: 10850).
          formula: "max(done > 0 ? offered * comp / done : offered, comp) / 37540"
        triggers:
          - name: offered        # prompt tokens/s the router sends to prefill pods
            type: prometheus
            metricType: AverageValue
            query: |
              sum(rate(llm_d_epp_prefix_prompt_tokens_sum{namespace="${namespace.name}",job="${model.idLabel}-router-epp",plugin_name="approx-prefix-cache-producer",endpoint_role="prefill"}[1m]))
            threshold: "1"
            activationThreshold: "0"
            ignoreNullValues: false   # a lost EPP series is an error (fallback), not zero demand
          - name: comp           # prompt tokens/s the prefill pods computed (not cached, not transferred)
            type: prometheus
            metricType: AverageValue
            query: |
              sum(rate(vllm:prompt_tokens_by_source_total{namespace="${namespace.name}",role="prefill",pod=~"${model.idLabel}-prefill-.*",source="local_compute"}[5m]))
            threshold: "1"
            activationThreshold: "0"
            ignoreNullValues: false
          - name: done           # all prompt tokens/s of the prefills the prefill pods finished
            type: prometheus
            metricType: AverageValue
            query: |
              sum(rate(vllm:prompt_tokens_total{namespace="${namespace.name}",role="prefill",pod=~"${model.idLabel}-prefill-.*"}[5m]))
            threshold: "1"
            activationThreshold: "0"
            ignoreNullValues: false
      # -----------------------------------------------------------------------
      # DECODE. Driver: decode concurrency (running + waiting on the decode pods),
      # 4 per pod; it follows output length and needs no per-mix capacity constant.
      # Guards, in the same max(): offered decode demand (router requests/s x mean
      # output tokens, at the driver's own operating point, so it wins only while
      # prefill is short), KV (Ready pods x mean KV usage / 0.8) and ITL (Ready
      # pods x ITL p90 / the ITL SLO); minReplicas >= 1; fallback.
      # -----------------------------------------------------------------------
      - name: ${model.idLabel}-decode
        scaleTargetRef:
          kind: Deployment
          name: ${model.idLabel}-decode
        minReplicas: 2           # never 0 under P/D; CALIBRATE to the base load
        maxReplicas: 6
        pollingInterval: 15
        fallback:
          failureThreshold: 3
          replicas: 2
          behavior: currentReplicasIfHigher
        behavior:
          scaleUp:               # the API default: max(+4 pods, +100 %) per 15 s
            stabilizationWindowSeconds: 0
            selectPolicy: Max
            policies:
              - type: Pods
                value: 4
                periodSeconds: 15
              - type: Percent
                value: 100
                periodSeconds: 15
          scaleDown:
            stabilizationWindowSeconds: 300
            selectPolicy: Max
            policies:
              - type: Pods
                value: 1
                periodSeconds: 120
        scalingModifiers:
          target: "1"
          metricType: AverageValue
          # CALIBRATE, one DeepSeek-V2-Lite H100 decode pod at the blend's knee (blis):
          # 510 = 1.3 x the requests (running + waiting) it holds (GLM-5.3 TP8 H200: 4);
          # 8.4 = the same operating point in completions/s (0.39); 2133 = the mean output length
          # used before the first completion (700); 0.05 = the ITL SLO (s), the run set's TPOT
          # limit (0.075).
          formula: "max(conc / 510, (ok > 0 ? lam * gen / ok : lam * 2133) / (8.4 * 2133), pods * kv / 0.8, pods * itl / 0.05)"
        triggers:
          - name: conc           # driver: requests in progress on decode
            type: prometheus
            metricType: AverageValue
            query: |
              sum(vllm:num_requests_running{namespace="${namespace.name}",role="decode",pod=~"${model.idLabel}-decode-.*"})
              + sum(vllm:num_requests_waiting{namespace="${namespace.name}",role="decode",pod=~"${model.idLabel}-decode-.*"})
            threshold: "1"
            activationThreshold: "0"
            ignoreNullValues: false
          - name: lam            # offered requests/s at the router (flow control off: admitted + 503-shed)
            type: prometheus
            metricType: AverageValue
            query: |
              sum(rate(llm_d_epp_request_total{namespace="${namespace.name}",job="${model.idLabel}-router-epp"}[1m]))
              + (sum(rate(llm_d_epp_request_error_total{namespace="${namespace.name}",job="${model.idLabel}-router-epp",error_code="ServiceUnavailable"}[1m])) or vector(0))
            threshold: "1"
            activationThreshold: "0"
            ignoreNullValues: false
          - name: gen            # output tokens/s decode produced
            type: prometheus
            metricType: AverageValue
            query: |
              sum(rate(vllm:generation_tokens_total{namespace="${namespace.name}",role="decode",pod=~"${model.idLabel}-decode-.*"}[5m])) or vector(0)
            threshold: "1"
            activationThreshold: "0"
          - name: ok             # requests/s decode finished (gen / ok = mean output length)
            type: prometheus
            metricType: AverageValue
            query: |
              sum(rate(vllm:request_success_total{namespace="${namespace.name}",role="decode",pod=~"${model.idLabel}-decode-.*"}[5m])) or vector(0)
            threshold: "1"
            activationThreshold: "0"
          - name: pods           # decode pods reporting metrics (Ready, in practice)
            type: prometheus
            metricType: AverageValue
            query: |
              count(count by (pod) (vllm:num_requests_running{namespace="${namespace.name}",role="decode",pod=~"${model.idLabel}-decode-.*"})) or vector(0)
            threshold: "1"
            activationThreshold: "0"
          - name: kv             # guard: mean decode KV usage
            type: prometheus
            metricType: AverageValue
            query: |
              avg(vllm:kv_cache_usage_perc{namespace="${namespace.name}",role="decode",pod=~"${model.idLabel}-decode-.*"}) or vector(0)
            threshold: "1"
            activationThreshold: "0"
          - name: itl            # guard: decode ITL p90 over 2 min; `> 0` drops an idle window's NaN
            type: prometheus
            metricType: AverageValue
            query: |
              (histogram_quantile(0.9, sum by (le) (rate(vllm:inter_token_latency_seconds_bucket{namespace="${namespace.name}",role="decode",pod=~"${model.idLabel}-decode-.*"}[2m]))) > 0)
              or vector(0)
            threshold: "1"
            activationThreshold: "0"

    # =========================================================================
    # COMMON — shared-memory volume only. Backends that need extra volumes
    # (plugins, model config) add them under decode/prefill in their overlay.
    # =========================================================================
    vllmCommon:
      shmMemory: 500Mi
      volumes:
        - name: dshm
          type: emptyDir
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm

    storage:
      workloadPvc:
        accessModes:
          - ReadWriteMany
        storageClassName: auto
      modelPvc:
        size: 40Gi
        accessModes:
          - ReadWriteMany
        storageClassName: auto

    timeouts:
      controlWait: 300
      harnessWait: 900000

    workDir: "~/data/pd-disaggregation"

    harness:
      name: inference-perf
      experimentProfile: sanity_random.yaml
      pvcSize: 3Gi
      resources:
        cpu: "1"
        memory: 2Gi
