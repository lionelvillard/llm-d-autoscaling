fullnameOverride: qwen-qwe-88633019-qwen3-8b


schedulerName: default-scheduler

modelArtifacts:
  name: Qwen/Qwen3-8B
  uri: hf://Qwen/Qwen3-8B
  size: 20Gi
  mountPath: /model-cache
  labels:
    llm-d.ai/inferenceServing: "true"
    llm-d.ai/model: qwen-qwe-88633019-qwen3-8b
    llm-d.ai/guide: "optimized-baseline"

multinode: false

accelerator:
  type: nvidia

  dra: false


routing:
  servicePort: 8000
  proxy:
    enabled: false
    image: "ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.11.0"
    imagePullPolicy: Always
    targetPort: 8200
    connector: nixlv2
    secure: false
    zapEncoder: json
    zapLogLevel: debug
    debugLevel: 3


decode:
  create: true
  replicas: 1

  autoscaling:
    enabled: false




  acceleratorTypes:
    labelKey: nvidia.com/gpu.product
    labelValues:
    - "NVIDIA-H100-80GB-HBM3"

  parallelism:
    tensor: 1
    data: 1
    dataLocal: 1
    workers: 1





  accelerator:
    dra: false





  initContainers:
    - name: preprocess
      image: ghcr.io/llm-d/llm-d-benchmark:v0.8.9
      imagePullPolicy: Always
      command:
      - set_llmdbench_environment.py
      - -e
      - /shared-config/llmdbench_env.sh
      - -i
      env:
      - name: VLLM_IS_DECODE
        value: "1"
      - name: HOME
        value: "/tmp"
      - name: USER
        value: "llm-d"
      - name: MODEL_SERVE_REF
        value: "Qwen/Qwen3-8B"
      - name: MODEL_NAME
        value: "Qwen/Qwen3-8B"
      - name: MODEL_PATH
        value: "models/Qwen/Qwen3-8B"
      - name: VLLM_CACHE_ROOT
        value: "/tmp/vllm"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_LOGGING_LEVEL
        value: "INFO"
      - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
        value: "120"
      - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
        value: "1"
      - name: VLLM_SERVER_DEV_MODE
        value: "1"
      - name: VLLM_INFERENCE_PORT
        value: "8000"
      - name: VLLM_METRICS_PORT
        value: "8200"
      - name: VLLM_BLOCK_SIZE
        value: "64"
      - name: VLLM_MAX_MODEL_LEN
        value: "32768"
      - name: VLLM_LOAD_FORMAT
        value: "auto"
      - name: VLLM_ACCELERATOR_MEM_UTIL
        value: "0.9"
      - name: VLLM_MAX_NUM_SEQ
        value: "256"
      - name: VLLM_TENSOR_PARALLELISM
        value: "1"
      - name: VLLM_MAX_NUM_BATCHED_TOKENS
        value: "256"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: UCX_TLS
        value: "sm,cuda_ipc,cuda_copy,tcp"
      - name: UCX_SOCKADDR_TLS_PRIORITY
        value: "tcp"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: LLMDBENCH_POD_NS
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace

      volumeMounts:
      - mountPath: /shared-config
        name: shared-config


  containers:
  - name: "vllm"
    image: "docker.io/vllm/vllm-openai:v0.31.0@sha256:a4a4c0437bf7240089da5f08aa370c4aee17ae5290f7a3b468825ee26c4c3a6b"
    imagePullPolicy: IfNotPresent
    mountModelVolume: true
    modelCommand: custom
    command:
      - /bin/bash
      - '-c'
    args:
      - |
        /bin/true ; export LD_LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | sed ':a; N; $!ba; s/\n/:/g'):${LD_LIBRARY_PATH}
        export LIBRARY_PATH=$(find / -name libcuda.so.1 -printf '%h\n' 2>/dev/null | head -1):${LIBRARY_PATH}

        . /shared-config/llmdbench_env.sh
        vllm serve $MODEL_SERVE_REF \
        --host 0.0.0.0 \
        --served-model-name $MODEL_NAME \
        --port $VLLM_INFERENCE_PORT \
        --max-model-len $VLLM_MAX_MODEL_LEN \
        --max-num-seqs 128 \
        --gpu-memory-utilization $VLLM_ACCELERATOR_MEM_UTIL \
        --disable-uvicorn-access-log \
        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
        --dtype bfloat16 \
    env:
      - name: VLLM_IS_DECODE
        value: "1"
      - name: HOME
        value: "/tmp"
      - name: USER
        value: "llm-d"
      - name: MODEL_SERVE_REF
        value: "Qwen/Qwen3-8B"
      - name: MODEL_NAME
        value: "Qwen/Qwen3-8B"
      - name: MODEL_PATH
        value: "models/Qwen/Qwen3-8B"
      - name: VLLM_CACHE_ROOT
        value: "/tmp/vllm"
      - name: VLLM_WORKER_MULTIPROC_METHOD
        value: "spawn"
      - name: VLLM_LOGGING_LEVEL
        value: "INFO"
      - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
        value: "120"
      - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
        value: "1"
      - name: VLLM_SERVER_DEV_MODE
        value: "1"
      - name: VLLM_INFERENCE_PORT
        value: "8000"
      - name: VLLM_METRICS_PORT
        value: "8200"
      - name: VLLM_BLOCK_SIZE
        value: "64"
      - name: VLLM_MAX_MODEL_LEN
        value: "32768"
      - name: VLLM_LOAD_FORMAT
        value: "auto"
      - name: VLLM_ACCELERATOR_MEM_UTIL
        value: "0.9"
      - name: VLLM_MAX_NUM_SEQ
        value: "256"
      - name: VLLM_TENSOR_PARALLELISM
        value: "1"
      - name: VLLM_MAX_NUM_BATCHED_TOKENS
        value: "256"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: UCX_TLS
        value: "sm,cuda_ipc,cuda_copy,tcp"
      - name: UCX_SOCKADDR_TLS_PRIORITY
        value: "tcp"
      - name: POD_IP
        valueFrom:
          fieldRef:
            apiVersion: v1
            fieldPath: status.podIP
      - name: LLMDBENCH_POD_NS
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace

    ports:
      - containerPort: 8000
        name: metrics
        protocol: TCP
    resources:
      limits:
        memory: 64Gi
        cpu: "8"
        nvidia.com/gpu: "1"
      requests:
        memory: 64Gi
        cpu: "8"
        nvidia.com/gpu: "1"
    extraConfig:
      startupProbe:
        httpGet:
          path: /health
          port: 8000
        failureThreshold: 60
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
      livenessProbe:
        tcpSocket:
          port: 8000
        failureThreshold: 10
        periodSeconds: 5
        timeoutSeconds: 15
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        failureThreshold: 10
        periodSeconds: 5
        timeoutSeconds: 15
    volumeMounts:
      - name: shared-config
        mountPath: /shared-config
      - name: dshm
        mountPath: /dev/shm

  volumes:
    - name: shared-config
      emptyDir: {}
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi

  monitoring:
    podmonitor:
      enabled: false

prefill:
  create: false

extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: wva-prometheus-auth
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: allow-thanos-querier-api-access-npdfc-knee
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: allow-thanos-querier-api-access
    subjects:
    - kind: ServiceAccount
      name: wva-prometheus-auth
      namespace: npdfc-knee
